name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4

      - name: Налаштувати Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Встановити залежності (крок "збірки")
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Перевірити стиль коду (flake8)
        run: flake8 .

      - name: Запустити тести
        run: pytest -v

  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4

      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Зібрати Docker-образ (крок "Package")
        run: |
          IMAGE=ghcr.io/bansheedl/ci-lab-app
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag $IMAGE:latest $IMAGE:${{ github.ref_name }}
          fi

      - name: Завантажити образ у реєстр
        run: |
          IMAGE=ghcr.io/bansheedl/ci-lab-app
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker push $IMAGE:${{ github.ref_name }}
          fi
